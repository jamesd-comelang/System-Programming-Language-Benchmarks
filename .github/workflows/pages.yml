name: pages

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18.x
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/configure-pages@v4
      - name: Build site
        run: |
          cd website
          pnpm i
          PAGES_BASE=/System-Programming-Language-Benchmarks/ pnpm build
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
