name: bench
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: "0 0 1 * *"
env:
  PROFILE: /tmp/.tmpprofile
  # https://doc.rust-lang.org/cargo/reference/profiles.html#incremental
  CARGO_INCREMENTAL: 1
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      # fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        lang: [
            c,
            cpp,
            go,
            rust,
            zig,
          ]
    steps:
      - run: lscpu
      - run: dotnet --info
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.x"
      - name: Install
        run: |
          echo '# placeholder' > $PROFILE
          dotnet --info
          sudo apt-get update -y
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install rust stable
        uses: actions-rs/toolchain@v1
        if: matrix.lang == 'rust'
        with:
          toolchain: stable
          override: true
      - name: Install rust nightly
        if: matrix.lang == 'rust'
        run: |
          rustup update nightly
          cargo +nightly --version
      - name: Install clang deps
        if: matrix.lang == 'c' || matrix.lang == 'cpp'
        run: ./.github/clang.sh
      # - name: Install c deps
      #   if: matrix.lang == 'c'
      #   run: ./.github/c.sh
      # - name: Install cpp deps
      #   if: matrix.lang == 'cpp'
      #   run: ./.github/cpp.sh
      - name: Install zig
        if: matrix.lang == 'zig' || matrix.lang == 'c' || matrix.lang == 'cpp'
        run: ./.github/zig.sh
      - run: dotnet --info
      - name: Build
        run: |
          source $PROFILE
          pushd bench
          dotnet run -c Release --project tool -- --task build --langs ${{ matrix.lang }} 
          popd
      - name: Test
        run: |
          source $PROFILE
          pushd bench
          dotnet run -c Release --project tool -- --task test --langs ${{ matrix.lang }} 
          popd
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: build-${{ matrix.lang }}
          path: bench/build/**/*
          if-no-files-found: error
  gate:
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04]
    steps:
      - run: echo 'dummy step as PR gate'
  bench:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04]
    steps:
      - run: lscpu
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.x"
      - name: Install
        run: |
          dotnet --info
          echo '# placeholder' > $PROFILE
          sudo apt-get update -y
      - uses: actions/checkout@v3
      # - name: Check CPU Model
      #   run: |
      #     source $PROFILE
      #     pushd bench
      #     dotnet run -c Release --project tool -- --task checkcpu
      #     popd
      - run: ./.github/clang.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: bench/build/
      - name: Bench
        run: |
          source $PROFILE
          pushd bench
          dotnet run -c Release --project tool -- --task test --ignore-missing
          dotnet run -c Release --project tool -- --task bench --ignore-missing
          popd
      - uses: actions/upload-artifact@v4
        with:
          name: log
          path: bench/build/_results/**/*
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [bench]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18.x
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/download-artifact@v4
        with:
          # Artifact name
          name: log
          # Destination path
          path: bench/build/_results/
      - name: Install
        run: |
          ls -al bench/build/_results/
      - name: Site Update Content
        run: |
          pushd website
          pnpm i
          pnpm content
          pnpm build
          pnpm archive-dist
        env:
          GOOGLE_TAG_ID: ${{ secrets.GOOGLE_TAG_ID }}
      - name: Site Publish
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_PUBLISH_TOKEN: ${{ secrets.VERCEL_PUBLISH_TOKEN }}
        run: |
          npm i -g vercel
          vercel --version
          vercel website --prod --yes -t $VERCEL_PUBLISH_TOKEN || echo 'ignore errors'
