name: bench
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    # The publish job commits fresh results to website/content/ on main.
    # Those commits must not retrigger this workflow (that would loop:
    # bench -> publish commit -> bench -> ...). The Pages workflow
    # triggers on website/** pushes, so it still picks them up.
    paths-ignore:
      - 'website/content/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: "0 0 1 * *"
env:
  PROFILE: /tmp/.tmpprofile
  # https://doc.rust-lang.org/cargo/reference/profiles.html#incremental
  CARGO_INCREMENTAL: 1
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      # fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        lang: [
            c,
            cpp,
            go,
            rust,
            zig,
          ]
    steps:
      - run: lscpu
      - run: dotnet --info
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.x"
      - name: Install
        run: |
          echo '# placeholder' > $PROFILE
          dotnet --info
          sudo apt-get update -y
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install rust stable
        uses: actions-rs/toolchain@v1
        if: matrix.lang == 'rust'
        with:
          toolchain: stable
          override: true
      - name: Install rust nightly
        if: matrix.lang == 'rust'
        run: |
          rustup update nightly
          cargo +nightly --version
      - name: Install clang deps
        if: matrix.lang == 'c' || matrix.lang == 'cpp'
        run: ./.github/clang.sh
      # - name: Install c deps
      #   if: matrix.lang == 'c'
      #   run: ./.github/c.sh
      # - name: Install cpp deps
      #   if: matrix.lang == 'cpp'
      #   run: ./.github/cpp.sh
      - name: Install zig
        if: matrix.lang == 'zig' || matrix.lang == 'c' || matrix.lang == 'cpp'
        run: ./.github/zig.sh
      - run: dotnet --info
      - name: Build
        run: |
          source $PROFILE
          pushd bench
          dotnet run -c Release --project tool -- --task build --langs ${{ matrix.lang }} 
          popd
      - name: Test
        run: |
          source $PROFILE
          pushd bench
          dotnet run -c Release --project tool -- --task test --langs ${{ matrix.lang }} 
          popd
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: build-${{ matrix.lang }}
          path: bench/build/**/*
          if-no-files-found: error
  gate:
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04]
    steps:
      - run: echo 'dummy step as PR gate'
  bench:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04]
    steps:
      - run: lscpu
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.x"
      - name: Install
        run: |
          dotnet --info
          echo '# placeholder' > $PROFILE
          sudo apt-get update -y
      - uses: actions/checkout@v3
      # - name: Check CPU Model
      #   run: |
      #     source $PROFILE
      #     pushd bench
      #     dotnet run -c Release --project tool -- --task checkcpu
      #     popd
      - run: ./.github/clang.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: bench/build/
      - name: Bench
        run: |
          source $PROFILE
          pushd bench
          dotnet run -c Release --project tool -- --task test --ignore-missing
          dotnet run -c Release --project tool -- --task bench --ignore-missing
          popd
      - uses: actions/upload-artifact@v4
        with:
          name: log
          path: bench/build/_results/**/*
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [bench]
    runs-on: ${{ matrix.os }}
    # The publish job pushes a commit, so it needs write access.
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v3
        with:
          # A full clone so the push below (and a rebase retry) works.
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 18.x
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/download-artifact@v4
        with:
          # Artifact name
          name: log
          # Destination path
          path: bench/build/_results/
      - name: Install
        run: |
          ls -al bench/build/_results/
      - name: Site Update Content
        run: |
          pushd website
          pnpm i
          pnpm content
          # Validate that the fresh results still generate a working
          # site before committing them. The actual Pages deploy is
          # done by .github/workflows/pages.yml on the commit below.
          pnpm build
        env:
          GOOGLE_TAG_ID: ${{ secrets.GOOGLE_TAG_ID }}
      # The live site is GitHub Pages, which builds from the committed
      # website/content/. Previously this step deployed to Vercel and
      # never committed anything back, so Pages kept showing the old
      # upstream snapshot while fresh results only ever reached Vercel.
      # Committing here triggers the Pages workflow (website/** push);
      # it does NOT retrigger this workflow (see paths-ignore above),
      # and it must NOT use [skip ci] for the same reason.
      - name: Commit fresh results
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/content
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "Update benchmark results (run ${{ github.run_id }})"
          git push || { git pull --rebase && git push; }
